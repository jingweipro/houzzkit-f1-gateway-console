name: F1 独立显式代理（本地候选）
version: 0.1.0-dev
bundle_id: com.jingweipro.f1.standalone
app_info: app_info.md
hos_version: 2024.1.0
config_version: 1.0.0
docker_config:
  image_name: localhost/f1-standalone
  tag: arm64-dev
  container_name: f1-standalone
  network_mode: bridge
  icon: icon.png
  web_ui_port: '17681'
  ports:
  - host: '17681'
    container: '17680'
    network_protocol: tcp
  - host: '17891'
    container: '17890'
    network_protocol: tcp
  volumes:
  - container: /data
    host: /var/data/f1-standalone-mvp
  env_variables: []
  devices: []
  command: []
  privileged_mode: false
  restart_policy: unless-stopped
  resources_limit: false
  maximum_cpu_usage: '0'
  memory_limit: '0'
  container_hostname: f1-standalone
  cap_add: []
hdp_update_info: ''
init_config: flow_config.yml
uninstall: ''
resource_files:
- file_type: file
  path: init.sh
author: jingweipro
