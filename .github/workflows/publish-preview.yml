name: Publish ARM64 preview image (manual, NOT HOS store release)
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Mandatory source, history and HOS package privacy scan
        run: python3 tools/publication_guard.py --history --extra-dir standalone/store
      - name: Build exact candidate for ARM64
        run: docker buildx build --progress=plain --platform linux/arm64 --load --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -f standalone/Dockerfile -t f1-standalone:checked .
      - name: Verify image user and architecture
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' f1-standalone:checked)" = arm64
          test "$(docker image inspect -f '{{.Config.User}}' f1-standalone:checked)" = 10001:10001
      - name: Mandatory image filesystem and layer privacy scan before registry login
        run: |
          docker image save -o "$RUNNER_TEMP/f1-checked.tar" f1-standalone:checked
          python3 tools/publication_guard.py --image-tar "$RUNNER_TEMP/f1-checked.tar"
          rm -f "$RUNNER_TEMP/f1-checked.tar"
      - name: Real Mihomo HTTP/SOCKS5 smoke without external networking
        run: |
          docker run --rm --platform linux/arm64 --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/standalone/tests:/opt/qa/tests:ro" f1-standalone:checked \
            python -B -m unittest discover -s /opt/qa/tests -p test_core.py -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the EXACT scanned image (no second build)
        run: |
          image="ghcr.io/${{ github.repository }}:0.1.0-dev-arm64"
          sha_image="ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA:0:12}"
          checked_id="$(docker image inspect -f '{{.Id}}' f1-standalone:checked)"
          docker tag f1-standalone:checked "$image"
          docker tag f1-standalone:checked "$sha_image"
          test "$(docker image inspect -f '{{.Id}}' "$image")" = "$checked_id"
          test "$(docker image inspect -f '{{.Id}}' "$sha_image")" = "$checked_id"
          docker push "$image"
          docker push "$sha_image"
          docker buildx imagetools inspect "$image"
