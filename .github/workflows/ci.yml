name: Offline source tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Privacy gate before all source tests
        run: python tools/publication_guard.py --history
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py
      - run: node --check app/app.js
      - run: bash -n tools/arm64_lab.sh
